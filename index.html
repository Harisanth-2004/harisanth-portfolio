<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171715" />
    <meta name="description" content="B Harisanth Krishna — engineering and management, through selected work and experience." />
    <title>B Harisanth Krishna — Engineering &amp; Management</title>
    <script>
      try {
        const theme = localStorage.getItem("bhk-theme");
        document.documentElement.classList.toggle(
          "dark",
          theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches),
        );
        const mode = localStorage.getItem("bhk-mode");
        document.documentElement.dataset.mode = mode === "eng" || mode === "mgmt" ? mode : "neutral";
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Geist:wght@400;450;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
