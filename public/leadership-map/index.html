<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f5f3">
<title>B Harisanth Krishna — Personal Leadership Map</title>
<style>
:root{--bg:#f3f5f3;--paper:#fff;--ink:#202b29;--muted:#61706a;--line:#aab5b0;--green:#145b50;--mint:#bedbd0;--coral:#f4a09b;--gold:#f0d477;--peach:#f5b18e;--blue:#a9c7d2;--lav:#c7bfdd;--sand:#d8bd9b;--serif:Georgia,'Times New Roman',serif;--sans:Arial,Helvetica,sans-serif;--tumble:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45}.shell{max-width:1220px;margin:auto;padding:22px clamp(16px,4vw,54px) 46px}.top{position:relative;z-index:25;display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:center;padding:0 0 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.top strong{color:var(--ink);font-size:13px;font-weight:700}.top span{margin-left:auto;margin-right:4px}.view{min-height:calc(100vh - 90px)}.home-view{display:block}.detail-view{display:none}
.hero{padding:28px 0 8px;display:flex;justify-content:space-between;align-items:end;gap:22px}.hero h1{font-size:clamp(30px,4.8vw,54px);letter-spacing:-.065em;line-height:1;margin:0}.hero h1 span{display:block;color:var(--green)}.hero .sub{font:16px/1.45 var(--serif);color:var(--muted);margin:8px 0 0}.hero .hint{font-size:12px;color:var(--muted);text-align:right;max-width:190px;margin:0 0 4px}
.wheel{position:relative;height:clamp(560px,60vw,640px);max-width:1100px;margin:0 auto;isolation:isolate;animation:tumble-in 260ms var(--tumble) both}.wheel-lines{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:auto}.wheel-lines line.spoke-hit{stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}.wheel-lines line.spoke-visible{stroke:var(--line);stroke-width:1.15;pointer-events:none}.wheel-lines circle{fill:var(--ink);pointer-events:none}.hub{position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(170px,22vw,230px);aspect-ratio:1;border-radius:50%;background:var(--mint);border:1px solid var(--line);color:var(--ink);display:grid;align-content:center;justify-items:center;text-align:center}.hub:before{content:"";position:absolute;inset:11px;border:1px solid var(--line);border-radius:50%}.hub svg{width:clamp(62px,8vw,86px);height:auto;margin-bottom:5px}.hub b{font-size:13px;letter-spacing:.08em;text-transform:uppercase;line-height:1.2}.hub small{font-size:11px;color:#586a63;margin-top:5px}
.pointer{--px:50%;--py:50%;--color:#ddd;position:absolute;z-index:2;left:var(--px);top:var(--py);transform:translate(-50%,-50%);width:112px;min-height:94px;padding:4px;border:0;background:transparent;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}.pointer .bubble{width:61px;height:61px;border-radius:50%;background:var(--color);display:grid;place-items:center;transition:transform 150ms ease,box-shadow 150ms ease}.pointer svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.pointer .word{font-size:12px;font-weight:700;line-height:1.15;text-align:center;max-width:132px}.pointer .mini{font-size:10px;line-height:1.2;text-align:center;color:var(--muted);max-width:132px}.edit-toggle{position:static;flex:0 0 auto;z-index:30;font:inherit;font-size:12px;padding:7px 11px;border:1px solid #bdc9c3;border-radius:3px;background:var(--paper);color:var(--ink);cursor:pointer}.edit-toggle:focus-visible{outline:3px solid var(--green);outline-offset:3px}.edit-toggle[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}[contenteditable=true]{outline:1px dashed var(--green);outline-offset:3px;border-radius:2px}.pointer:hover .bubble{transform:scale(1.07);box-shadow:0 0 0 2px white,0 0 0 3px var(--green)}.pointer:focus-visible,.action:focus-visible{outline:3px solid var(--green);outline-offset:4px;border-radius:4px}.p1{--px:16%;--py:18%;--color:var(--coral)}.p2{--px:36%;--py:12%;--color:var(--gold)}.p3{--px:64%;--py:12%;--color:var(--peach)}.p4{--px:84%;--py:18%;--color:var(--blue)}.p5{--px:89%;--py:50%;--color:var(--lav)}.p6{--px:83%;--py:78%;--color:var(--coral)}.p7{--px:64%;--py:86%;--color:var(--gold)}.p8{--px:36%;--py:86%;--color:var(--blue)}.p9{--px:17%;--py:78%;--color:var(--peach)}.p10{--px:11%;--py:50%;--color:var(--sand)}
/* Single clue view */.detail-view{max-width:850px;margin:0 auto;padding:clamp(30px,8vh,82px) 0 40px;grid-template-columns:150px 1fr;gap:clamp(22px,5vw,58px);align-content:center}.detail-view.is-visible{position:fixed;inset:0;z-index:20;width:100%;height:100vh;max-width:none;min-height:100vh;margin:0;padding:clamp(24px,6vh,72px) clamp(18px,6vw,80px);background:var(--bg);display:grid;grid-template-columns:minmax(90px,150px) minmax(0,850px);gap:clamp(22px,5vw,58px);align-content:center;justify-content:center;animation:none}.detail-mark{display:grid;justify-items:center;align-content:start;gap:12px;color:var(--green);text-align:center}.detail-mark .bubble{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:var(--mark,#d9e7e0)}.detail-mark svg{width:44px;height:44px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.detail-mark small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}.detail-copy{padding:2px 0 0}.detail-copy .eyebrow{color:var(--green);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px}.detail-copy h2{font-size:clamp(32px,5vw,54px);line-height:1;letter-spacing:-.06em;margin:0 0 20px}.detail-copy p{font:clamp(17px,2.2vw,21px)/1.5 var(--serif);color:#394641;margin:0;max-width:60ch}.detail-copy .detail{font:15px/1.6 var(--sans);color:var(--muted);margin-top:15px}.detail-actions{display:flex;gap:10px;margin-top:30px}.action{font:inherit;font-size:13px;font-weight:700;padding:11px 16px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:3px;cursor:pointer}.action.primary{background:var(--green);border-color:var(--green);color:white}.action:hover{filter:brightness(.96)}.detail-out{animation:tumble-out 230ms var(--tumble) both!important}.detail-view.detail-out{display:grid}.wheel-out{animation:tumble-out 230ms var(--tumble) both!important}
@keyframes tumble-in{from{opacity:.15;transform:translateY(-16px) rotate(-9deg) scale(.96)}to{opacity:1;transform:translateY(0) rotate(0) scale(1)}}@keyframes tumble-out{from{opacity:1;transform:translateY(0) rotate(0) scale(1)}to{opacity:0;transform:translateY(16px) rotate(9deg) scale(.96)}}
@media(max-width:560px){.hero{align-items:flex-start;flex-direction:column;gap:8px}.hero .hint{text-align:left;max-width:none}.wheel{height:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:20px 0 0;animation:tumble-in 260ms var(--tumble) both}.wheel-lines,.hub{display:none}.pointer{position:static;left:auto;top:auto;transform:none;width:100%;min-height:62px;display:grid;grid-template-columns:43px minmax(0,1fr);grid-template-rows:auto auto;align-content:center;justify-content:stretch;gap:2px 9px;padding:8px;border:1px solid #d1d9d5;background:var(--paper);border-radius:3px}.pointer .bubble{grid-row:1 / span 2;width:43px;height:43px;flex:0 0 43px}.pointer svg{width:24px;height:24px}.pointer .word{text-align:left;max-width:none}.pointer .mini{text-align:left;max-width:none;font-size:9px}.pointer:hover .bubble{transform:none;box-shadow:none}.pointer:focus-visible{outline-offset:2px}.detail-view.is-visible{padding:38px 18px;grid-template-columns:95px minmax(0,1fr);gap:18px;align-content:center}.detail-mark .bubble{width:72px;height:72px}.detail-mark svg{width:36px;height:36px}}
@media(max-width:430px){.shell{padding:16px 12px 30px}.top{align-items:flex-start}.top strong{max-width:170px}.hero{padding-top:23px}.hero h1{font-size:34px}.wheel{gap:6px}.pointer{gap:7px;padding:7px;min-height:56px}.pointer .bubble{width:37px;height:37px;flex-basis:37px}.pointer .word{font-size:11px}.detail-view.is-visible{grid-template-columns:1fr;padding:70px 14px 28px;gap:12px;align-content:start}.detail-mark{display:flex;align-items:center;gap:10px;text-align:left}.detail-mark .bubble{width:56px;height:56px}.detail-mark svg{width:29px;height:29px}.detail-mark small{font-size:10px}.detail-copy h2{margin-bottom:15px}.detail-copy p{font-size:17px}.detail-copy .detail{font-size:13px}.detail-actions{margin-top:22px}}
@media(prefers-reduced-motion:reduce){.wheel,.detail-view.is-visible{animation:none}.wheel-out,.detail-out{animation:none!important}.pointer .bubble{transition:none}}
@media print{@page{size:A4 landscape;margin:8mm}.shell{padding:0}.top{padding-bottom:6px}.hero{padding:14px 0 0}.hero h1{font-size:34pt}.hero .sub{font-size:11pt}.hero .hint{display:none}.wheel{height:420px;max-width:800px;animation:none}.hub{width:165px}.pointer .bubble{width:48px;height:48px}.pointer svg{width:24px;height:24px}.pointer .word{font-size:9pt}.controls,.detail-view{display:none!important}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#080b0e;--paper:#121619;--ink:#f4f5f6;--muted:#b1b5ba;--line:#363b40;--green:#ed777b;--mint:#191d21;--coral:#e87579;--gold:#f4f5f6;--peach:#e87579;--blue:#f4f5f6;--lav:#e87579;--sand:#f4f5f6}
:root[data-theme="dark"] .action.primary{background:var(--green);color:#fff;border-color:var(--green)}
:root[data-theme="dark"] .p2 svg,:root[data-theme="dark"] .p4 svg,:root[data-theme="dark"] .p7 svg,:root[data-theme="dark"] .p8 svg,:root[data-theme="dark"] .p10 svg{color:#101214;stroke:#101214}
:root[data-theme="dark"] #detail-bubble[data-id="lantern"] svg,:root[data-theme="dark"] #detail-bubble[data-id="guides"] svg,:root[data-theme="dark"] #detail-bubble[data-id="tools"] svg,:root[data-theme="dark"] #detail-bubble[data-id="compass"] svg,:root[data-theme="dark"] #detail-bubble[data-id="northstar"] svg{color:#101214;stroke:#101214}
:root[data-theme="dark"] .detail-copy p{color:#e0e9e5}
:root[data-theme="dark"] .detail-copy .detail{color:var(--muted)}

<script>
const clues=[
{id:'backpack',title:'Backpack',text:'At school, I was junior headboy, headboy, and class representative. Teachers often selected me because of my academic performance.',extra:'In university, I wanted to build myself and become independent. I joined several clubs, worked with other leaders, entered executive committees from my second year, learned through mistakes, and taught my juniors.',color:'var(--coral)'},
{id:'lantern',title:'Lantern',text:'I want people to experience me as warm and welcoming, rather than overly authoritative.',extra:'I sway a little while speaking, and I find one-to-one eye contact difficult. I can practise grounding my stance and looking up naturally.',color:'var(--gold)'},
{id:'traps',title:'Traps',text:'Fear of underperforming can make me hyper-rational. I spend too long researching because I want to know everything before acting.',extra:'The cost is time that could have gone into doing the job.',color:'var(--peach)'},
{id:'guides',title:'Guides',text:'I’m learning to respect the process and allocate time accordingly instead of trying to be knowledgeable about everything.',extra:'I can learn while doing. I do not need to finish all my research before beginning.',color:'var(--blue)'},
{id:'lenses',title:'Lenses',text:'I haven’t yet stopped myself from taking on multiple tasks at once and prioritising them well.',extra:'My “yet” is learning to choose what matters first and give it the time it needs.',color:'var(--lav)'},
{id:'companions',title:'Companions',text:'I value discussion and stay open to criticism that can help me improve.',extra:'Add a specific piece of feedback from someone who has worked with you, and name one person who can help you practise prioritising.',color:'var(--coral)'},
{id:'tools',title:'Tools',text:'I’m open to discussing a topic and hearing different views. I try to include everyone rather than choose a side too quickly.',extra:'Being open to criticism is another way I try to keep improving.',color:'var(--gold)'},
{id:'compass',title:'Compass',text:'I have ethical rules I won’t abandon for an advantage. I also try to make sure people don’t feel left out.',extra:'I want to stay open to trying things. I can name my top three values in my own words as I refine the map.',color:'var(--blue)'},
{id:'fuel',title:'Fuel',text:'I wanted to build myself and become independent. I kept learning through leadership work and taught my juniors along the way.',extra:'A purpose statement to refine: keep growing through experience, and make learning easier for others.',color:'var(--peach)'},
{id:'northstar',title:'North Star',text:'I aim to keep becoming a better leader.',extra:'I’m still working out the longer-term impact or legacy I hope to leave. I don’t need to pretend that answer is finished.',color:'var(--sand)'}
];
try{const saved=JSON.parse(localStorage.getItem('plm-edit')||'{}');clues.forEach(c=>{if(saved.stories&&saved.stories[c.id])Object.assign(c,saved.stories[c.id])});if(saved.mini)document.querySelectorAll('[data-mini]').forEach(el=>{if(saved.mini[el.dataset.mini])el.textContent=saved.mini[el.dataset.mini]})}catch{}
let editMode=false;
const icons=Object.fromEntries([...document.querySelectorAll('.pointer')].map(b=>[b.dataset.id,b.querySelector('svg').outerHTML]));const wheel=document.querySelector('#wheel'),homeView=document.querySelector('#home-view'),detailView=document.querySelector('#detail');let current=0,busy=false;
function fill(i){current=(i+clues.length)%clues.length;const c=clues[current];document.querySelector('#detail-title').textContent=c.title;document.querySelector('#detail-index').textContent=`Clue ${String(current+1).padStart(2,'0')} of 10`;document.querySelector('#detail-text').textContent=c.text;document.querySelector('#detail-extra').textContent=c.extra;const bubble=document.querySelector('#detail-bubble');bubble.style.setProperty('--mark',c.color);bubble.dataset.id=c.id;bubble.innerHTML=icons[c.id];}
function flyClone(source,target,duration=520){const a=source.getBoundingClientRect(),b=target.getBoundingClientRect(),ghost=source.cloneNode(true),cs=getComputedStyle(source);ghost.style.position='fixed';ghost.style.left=a.left+'px';ghost.style.top=a.top+'px';ghost.style.width=a.width+'px';ghost.style.height=a.height+'px';ghost.style.margin='0';ghost.style.transformOrigin='top left';ghost.style.zIndex='1000';ghost.style.pointerEvents='none';ghost.style.opacity='1';ghost.style.display='grid';ghost.style.placeItems='center';ghost.style.borderRadius='50%';ghost.style.background=cs.backgroundColor;ghost.style.color=cs.color;const svg=ghost.querySelector('svg'),iconStyle=getComputedStyle(source.querySelector('svg'));if(svg){svg.style.width='30px';svg.style.height='30px';svg.style.fill=iconStyle.fill;svg.style.stroke=iconStyle.stroke;svg.style.strokeWidth=iconStyle.strokeWidth;svg.style.strokeLinecap=iconStyle.strokeLinecap;svg.style.strokeLinejoin=iconStyle.strokeLinejoin;svg.style.color=iconStyle.color}document.body.appendChild(ghost);const dx=b.left-a.left,dy=b.top-a.top,sx=b.width/a.width,sy=b.height/a.height;const animation=ghost.animate([{transform:'translate(0,0) scale(1,1)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')',opacity:1}],{duration,easing:'cubic-bezier(0.23,1,0.32,1)',fill:'forwards'});return{ghost,animation}}
function enter(i,sourceButton){if(busy)return;const index=Number.isInteger(i)&&i>=0?i:0,c=clues[index],button=sourceButton||wheel.querySelector('.pointer[data-id="'+c.id+'"]');if(!button)return;busy=true;fill(index);const iconTarget=document.querySelector('#detail-bubble'),titleTarget=document.querySelector('#detail-title');detailView.style.display='';detailView.classList.add('is-visible');detailView.setAttribute('aria-hidden','false');const iconSource=button.querySelector('.bubble'),wordSource=button.querySelector('.word');iconTarget.style.visibility='hidden';titleTarget.style.visibility='';if(matchMedia('(prefers-reduced-motion: reduce)').matches){homeView.style.display='none';iconTarget.style.visibility='';busy=false;document.querySelector('#next').focus({preventScroll:true});return}const iconFly=flyClone(iconSource,iconTarget),wheelRect=wheel.getBoundingClientRect(),iconRect=iconSource.getBoundingClientRect(),originX=iconRect.left+iconRect.width/2-wheelRect.left,originY=iconRect.top+iconRect.height/2-wheelRect.top;const wheelZoom=wheel.animate([{transformOrigin:originX+'px '+originY+'px',transform:'scale(1)',opacity:1},{transformOrigin:originX+'px '+originY+'px',transform:'scale(1.24)',opacity:0}],{duration:500,easing:'cubic-bezier(0.23,1,0.32,1)',fill:'forwards'});const wordFade=wordSource.animate([{opacity:1},{opacity:0}],{duration:180,delay:60,easing:'cubic-bezier(0.23,1,0.32,1)',fill:'forwards'});const titleReveal=titleTarget.animate([{opacity:0,transform:'translateY(7px)'},{opacity:1,transform:'translateY(0)'}],{duration:300,delay:150,easing:'cubic-bezier(0.23,1,0.32,1)',fill:'both'});document.querySelector('.detail-copy').animate([{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}],{duration:300,delay:170,easing:'cubic-bezier(0.23,1,0.32,1)',fill:'both'});Promise.all([iconFly.animation.finished,wordFade.finished,titleReveal.finished,wheelZoom.finished]).then(()=>{iconFly.ghost.remove();iconFly.animation.cancel();wheelZoom.cancel();wordFade.cancel();titleReveal.cancel();iconTarget.style.visibility='';homeView.style.display='none';wheel.style.animation='none';busy=false;document.querySelector('#next').focus({preventScroll:true})}).catch(()=>{iconFly.ghost.remove();iconFly.animation.cancel();wheelZoom.cancel();wordFade.cancel();titleReveal.cancel();iconTarget.style.visibility='';homeView.style.display='none';wheel.style.animation='none';busy=false})}
function goHome(){if(busy)return;busy=true;if(matchMedia('(prefers-reduced-motion: reduce)').matches){detailView.classList.remove('is-visible','detail-out');detailView.style.display='none';detailView.setAttribute('aria-hidden','true');homeView.style.display='block';busy=false;document.querySelector('.pointer[data-id="'+clues[current].id+'"]').focus({preventScroll:true});return}detailView.classList.remove('detail-out');detailView.classList.add('detail-out');window.setTimeout(()=>{detailView.classList.remove('is-visible','detail-out');detailView.style.display='none';detailView.setAttribute('aria-hidden','true');homeView.style.display='block';wheel.classList.remove('wheel-out');wheel.style.animation='none';void wheel.offsetWidth;wheel.style.animation='';busy=false;document.querySelector('.pointer[data-id="'+clues[current].id+'"]').focus({preventScroll:true})},250)}
wheel.addEventListener('click',event=>{const target=event.target.closest('[data-id]');if(!target||!wheel.contains(target))return;if(editMode&&event.target.closest('[contenteditable=true]'))return;const index=clues.findIndex(c=>c.id===target.dataset.id);if(index>=0)enter(index)});function nextClue(){if(busy)return;if(matchMedia('(prefers-reduced-motion: reduce)').matches){fill(current+1);return}busy=true;const parts=[document.querySelector('.detail-mark'),document.querySelector('.detail-copy')],out=parts.map(el=>el.animate([{transform:'translateX(0)',opacity:1},{transform:'translateX(-34px)',opacity:0}],{duration:180,easing:'cubic-bezier(0.77,0,0.175,1)',fill:'forwards'}));Promise.all(out.map(a=>a.finished)).then(()=>{fill(current+1);const incoming=parts.map(el=>el.animate([{transform:'translateX(34px)',opacity:0},{transform:'translateX(0)',opacity:1}],{duration:240,easing:'cubic-bezier(0.23,1,0.32,1)',fill:'forwards'}));return Promise.all(incoming.map(a=>a.finished)).then(()=>incoming.forEach(a=>a.cancel()))}).catch(()=>{fill(current+1)}).finally(()=>{busy=false})}
document.querySelector('#next').addEventListener('click',nextClue);document.querySelector('#home').addEventListener('click',goHome);
const themeToggle=document.querySelector('#theme-toggle');
function setTheme(theme,save=true){const dark=theme==='dark';document.documentElement.dataset.theme=dark?'dark':'light';themeToggle.textContent=dark?'Light mode':'Dark mode';themeToggle.setAttribute('aria-pressed',String(dark));if(save){try{localStorage.setItem('plm-theme',dark?'dark':'light')}catch{}}}
try{setTheme(localStorage.getItem('plm-theme')==='dark'?'dark':'light',false)}catch{setTheme('light',false)}
themeToggle.addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
const editButton=document.querySelector('#edit');
editButton.addEventListener('click',()=>{editMode=!editMode;editButton.setAttribute('aria-pressed',String(editMode));editButton.textContent=editMode?'Done':'Edit';document.querySelectorAll('.mini,#detail-title,#detail-text,#detail-extra').forEach(el=>el.contentEditable=editMode?'true':'false')});
function saveEdits(){try{const data={mini:{},stories:{}};document.querySelectorAll('[data-mini]').forEach(el=>data.mini[el.dataset.mini]=el.textContent);clues.forEach(c=>data.stories[c.id]={title:c.title,text:c.text,extra:c.extra});localStorage.setItem('plm-edit',JSON.stringify(data))}catch{}}
document.querySelectorAll('[data-mini]').forEach(el=>el.addEventListener('input',()=>{saveEdits()}));
['#detail-title','#detail-text','#detail-extra'].forEach(selector=>document.querySelector(selector).addEventListener('input',()=>{clues[current].title=document.querySelector('#detail-title').textContent;clues[current].text=document.querySelector('#detail-text').textContent;clues[current].extra=document.querySelector('#detail-extra').textContent;saveEdits()}));
</script></body></html>
